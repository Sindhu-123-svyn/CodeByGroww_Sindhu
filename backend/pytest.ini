[pytest]
asyncio_mode = auto
; The app's SQLAlchemy engine and Redis client are module-level singletons
; created once at import time and bound to whichever event loop is running
; then. pytest-asyncio's default per-test event loop would invalidate their
; connection pools between tests (surfaces as "Event loop is closed" on
; Windows) — session scope keeps one loop for the whole run, matching the
; singletons' actual lifetime.
asyncio_default_fixture_loop_scope = session
